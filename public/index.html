*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#FFFFFF;background:
  repeating-linear-gradient(-60deg,transparent 0 22px,rgba(255,255,255,.07) 22px 34px) right/240px 100% no-repeat,var(--navy);
  border-bottom:4px solid var(--ball)}
:dir(rtl) header.top{background-position:left}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{flex:none}
.brand h1,.brand .tag{white-space:nowrap}
@media (max-width:520px){.brand .logo{width:32px;height:32px}.brand h1{font-size:23px}.brand .tag{font-size:9px;letter-spacing:.08em}.langbtn{padding:4px 10px;font-size:12px}}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;margin:0;line-height:1;text-transform:uppercase}
.brand .tag{display:block;font-family:var(--display);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:var(--ball)}
:lang(ar) .brand h1{font-family:var(--display-ar);text-transform:none;font-size:21px;font-weight:800}
:lang(ar) .brand .tag{font-family:var(--display-ar);letter-spacing:0;font-size:12px}
#viewSwitch{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px;gap:2px}
#viewSwitch[hidden]{display:none}
#viewSwitch button{border:0;background:transparent;color:#fff;opacity:.8;font:700 13px var(--body);padding:4px 12px;border-radius:999px;cursor:pointer}
.clubsw{width:auto;max-width:200px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 12px;font:700 13px var(--body)}
.clubsw option{color:#111}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:400;font-size:12.5px;min-height:0}.sugg:empty{display:none}
.chipbtn{border:1.5px dashed var(--court);background:var(--court-soft);color:var(--court);border-radius:999px;padding:2px 10px;font:600 12.5px var(--body);cursor:pointer}
.hbreak{display:none}
.userchip{display:flex;align-items:center;gap:8px;min-width:0;max-width:260px}
.userchip{color:inherit;text-decoration:none;border-radius:999px;padding:2px 10px 2px 2px}.userchip:hover{background:rgba(255,255,255,.1)}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-weight:800;letter-spacing:.02em;object-fit:cover;overflow:hidden}
.userchip .av{box-shadow:0 0 0 2px var(--ball)}
.acct .avrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.userchip .ut{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.userchip .un{font:700 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip .ur{font:500 12px var(--body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.hbreak{display:block;order:1;flex-basis:100%;height:0}.userchip:not([hidden]){order:2;flex:1 1 0;min-width:150px;max-width:none}.clubsw:not([hidden]){order:3;flex:0 1 170px;min-width:120px;max-width:none}header.top nav.tabs{order:4}}
.coachbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.coachbar select{width:auto}
.mtable{width:100%;border-collapse:collapse}.mtable td,.mtable th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
#viewSwitch button[aria-pressed="true"]{opacity:1;background:var(--ball);color:var(--ball-ink)}
.langbtn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:4px 12px;font:600 13px var(--body);cursor:pointer}
nav.tabs{display:flex;gap:4px;width:100%;overflow-x:auto}
nav.tabs a{color:inherit;opacity:.78;text-decoration:none;padding:10px 12px 9px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--ball)}
main{padding-block:20px 80px}
h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:-.005em}
:lang(ar) h2{font-family:var(--display-ar);font-weight:800;font-size:25px;text-transform:none}
h3{font-size:16px;margin:0;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:lang(ar) .eyebrow{letter-spacing:0}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.section{display:grid;gap:14px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
a.card,button.card{display:block;color:inherit;text-decoration:none;text-align:start;width:100%;font:inherit;cursor:pointer}
a.card:hover,button.card:hover{border-color:var(--orange)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.btn.primary:hover{border-color:var(--orange)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);font-weight:700}
.btn.ball:hover{border-color:var(--ball-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2.5px solid var(--court);outline-offset:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.court{background:var(--court-soft);color:var(--court)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ball{background:var(--hot-soft);color:var(--hot-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.daygroup{display:grid;gap:8px}
.daylabel{display:flex;align-items:baseline;gap:8px;font-weight:600}
.daylabel .d{font-family:var(--display);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
:lang(ar) .daylabel .d{font-family:var(--display-ar);font-size:16px;text-transform:none}
.sess{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.sess .time{font-family:var(--display);font-weight:800;font-size:20px;color:var(--court);line-height:1;grid-row:span 2;min-width:58px;padding-top:2px}
.sess .time small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);margin-top:4px}
.sess .meta{min-width:0;display:grid;gap:6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty strong{color:var(--ink);font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font-size:15px;overflow-wrap:anywhere}
.kv span{font-size:12px;color:var(--muted)}
/* rating */
.rate{display:inline-flex;gap:4px}
.rate button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:700 15px var(--body);cursor:pointer}
.rate button[aria-pressed="true"].r1,.rate button[aria-pressed="true"].r2{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rate button[aria-pressed="true"].r2{background:var(--warn);border-color:var(--warn)}
.rate button[aria-pressed="true"].r3{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.rate button[aria-pressed="true"].r4{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.rate button[aria-pressed="true"].r5{background:var(--good);border-color:var(--good);color:var(--surface)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.dots.v1 i:nth-child(-n+1){background:var(--bad)}
.dots.v2 i:nth-child(-n+2){background:var(--warn)}
.dots.v3 i:nth-child(-n+3){background:var(--muted)}
.dots.v4 i:nth-child(-n+4){background:var(--court)}
.dots.v5 i:nth-child(-n+5){background:var(--good)}
.fbblock{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.fbrow{display:grid;grid-template-columns:1fr;gap:8px}
.overall{background:var(--sunk);border-radius:10px;padding:12px}
.evalbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.evlabel{font-size:13px;font-weight:600;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:3px;cursor:pointer;line-height:0;border-radius:6px}
.stars svg{width:30px;height:30px;fill:var(--line);transition:fill .12s,transform .12s}
.stars button.on svg{fill:var(--orange)}
.stars button:hover svg{transform:scale(1.12)}
.rword{font-size:13px;font-weight:600;color:var(--muted)}
.srow{display:inline-flex;gap:1px;vertical-align:middle;line-height:0}
.srow svg{width:14px;height:14px;fill:var(--line)}
.srow svg.on{fill:var(--orange)}
.skillrow{display:grid;grid-template-columns:minmax(0,1.3fr) auto 96px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.skillrow:last-child{border-bottom:0}
.skillrow .n{min-width:0}
.trend{font-size:12px;font-weight:600}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)} .trend.flat{color:var(--muted)}
.hist{display:grid;gap:10px}
.hist .item{display:grid;gap:8px}
.fbline{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.fbline .c{grid-column:2;color:var(--muted)}
svg.spark{display:block;width:96px;height:28px;overflow:visible}
/* forms */
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;font:15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--court);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
/* Safari gives date/time fields a fixed inner width that ignores the column, so they spilled over the next
   field (most visible in Arabic). Let them shrink to their column and keep the value inside the box. */
input[type=date],input[type=time]{display:block;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;min-height:40px;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:start;margin:0;min-width:0}
.fgrid>*{min-width:0}.fgrid>label.f{overflow:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.pick input{accent-color:var(--court)}
.pick label:has(input:checked){border-color:var(--court);background:var(--court-soft)}
.act{display:grid;grid-template-columns:1.2fr 1.4fr 80px auto;gap:8px;align-items:end;background:var(--sunk);padding:10px;border-radius:8px}
@media (max-width:620px){.act{grid-template-columns:1fr 1fr}.act .full{grid-column:1/-1}.skillrow{grid-template-columns:1fr auto;}.skillrow svg.spark{display:none}.skillrow .avg{display:none}}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sheet{background:var(--bg);width:min(640px,100%);max-height:100%;overflow:auto;border-radius:16px;padding:20px;display:grid;gap:16px;align-content:start;box-shadow:0 18px 50px rgba(5,12,40,.35);margin:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.code{font-family:var(--display);font-size:26px;font-weight:900;letter-spacing:.16em;direction:ltr}
.back{color:var(--court);text-decoration:none;font-weight:600;font-size:14px}
.hero{display:grid;gap:6px}
:root.wide .wrap{max-width:1200px}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{display:grid;align-content:start;gap:6px;min-width:0;background:var(--sunk);border-radius:var(--r);padding:8px}
.wday.today{background:var(--court-soft);box-shadow:inset 0 0 0 1.5px var(--court)}
.wday .wh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 4px}
.wday .wh b{font-family:var(--display);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
:lang(ar) .wday .wh b{font-family:var(--display-ar);text-transform:none;font-size:14px}
.wday .wh span{font-size:12px;color:var(--muted)}
.wsess{display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:inherit;text-decoration:none;font-size:13px;min-width:0}
a.wsess:hover{border-color:var(--orange)}
.wsess .tm{font-family:var(--display);font-weight:800;font-size:14px;color:var(--court)}
.wsess .nm{overflow-wrap:anywhere;font-weight:600}
.wsess.ghost{background:transparent;border:1.5px dashed var(--line)}
.wsess.done .tm{color:var(--good)} .wsess.cancelled{opacity:.55}
.wsess.cancelled .nm{text-decoration:line-through}
.wfree{font-size:12px;color:var(--muted);padding:4px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slot:last-child{border-bottom:0}
.slot .d{font-weight:600}
@media (max-width:900px){.weekgrid{grid-template-columns:1fr}.wday{grid-template-columns:1fr}.wfree{display:none}}

.wk-h .dd{font-family:var(--display);font-weight:900;font-size:24px;line-height:1}

  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh)),repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh)/2),var(--sunk) calc(var(--hh)/2) calc(var(--hh)/2 + 1px),transparent calc(var(--hh)/2 + 1px) var(--hh))}

.blk{position:absolute;box-sizing:border-box;padding:2px 3px;min-width:0}

.priv{display:flex;gap:6px;align-items:flex-start;color:var(--warn);font-size:13.5px}

.cview{margin-bottom:2px}
.pc-c.ghost{background:transparent;color:var(--orange);box-shadow:inset 0 0 0 1.5px var(--orange)}

.bband{position:absolute;inset-inline:2px;z-index:1;display:block;text-align:start;border-radius:6px;padding:3px 6px;font:600 11px var(--body);color:var(--bad);cursor:pointer;overflow:hidden;
  border:1px dashed color-mix(in srgb,var(--bad) 55%,var(--line));background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--bad) 13%,transparent) 0 6px,transparent 6px 12px)}

.wk-score .btn.blockbtn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
.blockcard{border:1px dashed color-mix(in srgb,var(--bad) 55%,var(--line));background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--bad) 7%,var(--surface)) 0 8px,var(--surface) 8px 16px)}

input[type=email],input[type=password]{width:100%;font:15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

function courtNameOf(s){if(!s||!s.courtId)return"";const c=courtsAt(s.location).find(x=>x.id===s.courtId);return c?courtLabel(c):(s.courtName||"")}
const placeOf=s=>[s.location,courtNameOf(s)].filter(Boolean).join(" · ");
function minToHHMM(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function courtSelect(id,venue,current,busy){const cs=courtsAt(venue);
  return`<select id="${id}" name="courtId"><option value="">—</option>${cs.map(c=>{const b=(busy||{})[c.id];return`<option value="${esc(c.id)}" ${c.id===current?"selected":""} ${b&&c.id!==current?"disabled":""}>${esc(courtLabel(c))}${b?` · ${t("busyAt")} ${esc(b)}`:""}</option>`}).join("")}</select>`}
// Which courts are taken on a day between st and en minutes (other sessions only), from the database.
async function busyCourts(date,st,en,exceptId){const out={};if(!date||st==null)return out;
  try{const {data,error}=await sb.rpc("court_busy",{p_date:date});throwIf(error);
    (data||[]).forEach(r=>{if(r.session_id===exceptId)return;const a=toMin(r.start_time);if(a==null)return;const b=a+(+r.duration||60);
      if(a<en&&b>st)out[r.court_id]=minToHHMM(a)+"–"+minToHHMM(b)})}catch(e){console.error(e)}
  return out}
function clubSelect(id,current){const names=clubList().map(c=>c.name);const opts=[...names];if(current&&!names.includes(current))opts.push(current);
  return`<select id="${id}" name="location"><option value="">—</option>${opts.map(n=>`<option value="${esc(n)}" ${n===current?"selected":""}>${esc(n)}</option>`).join("")}</select>`}
function sessSkills(s){const seen=[];(s.activities||[]).forEach(a=>{if(a.skillId&&!seen.includes(a.skillId))seen.push(a.skillId)});return seen}
function sortedSessions(){return Object.values(S.sessions).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))}
function statusPill(st){return st==="done"?`<span class="pill good">${t("done")}</span>`:st==="cancelled"?`<span class="pill bad">${t("cancelled")}</span>`:`<span class="pill court">${t("planned")}</span>`}
function kindPill(n){return n===0?`<span class="pill warn">${t("openSlot")}</span>`:n>1?`<span class="pill ball">${t("group")} · ${n}</span>`:`<span class="pill">${t("single")}</span>`}
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></svg>';
function dots(v){v=Math.round(v||0);return `<span class="srow" role="img" aria-label="${v}/5 ${v?t("r"+v):""}">${[1,2,3,4,5].map(i=>STAR.replace('<svg ',`<svg class="${i<=v?"on":""}" `)).join("")}</span>`}
function toast(msg){const l=$("#layer");const d=document.createElement("div");d.className="toast";d.innerHTML=`<span>${esc(msg)}</span>`;l.appendChild(d);setTimeout(()=>d.remove(),1800)}
function friendlyErr(e){const m=String(e&&e.message||"");
  if(/COURT_BUSY/.test(m)){const x=m.match(/from (\d{1,2}:\d{2}) for (\d+)/);return t("courtBusy")+(x?` (${x[1]}–${minToHHMM(toMin(x[1])+ +x[2])})`:"")+". "+t("courtBusyHint")}
  if(/COURT_NEEDS_TIME/.test(m))return t("needTime");return ""}
async function guard(fn){try{await fn();return true}catch(e){const fe=friendlyErr(e);if(!fe)console.error(e);toast(fe||t("error"));return false}}
function feedbackCount(s){let tot=0,doneN=0;const sk=sessSkills(s);activeIds(s).forEach(tid=>{sk.forEach(sid=>{tot++;if(s.feedback?.[tid]?.skills?.[sid]?.rating)doneN++})});return [doneN,tot]}

// history = per-trainee normalized record (shared shape for coach profile + trainee view)
function historyFor(tid){
  return sortedSessions().filter(s=>(s.traineeIds||[]).includes(tid)).reverse().map(s=>{
    const fb=s.feedback?.[tid]||{};
    const items=sessSkills(s).map(sid=>{const v=fb.skills?.[sid]||{};const sk=S.skills[sid]||{};return{skillId:sid,name_en:sk.name_en||"",name_ar:sk.name_ar||"",rating:v.rating||0,comment:v.comment||"",remark:v.remark||""}}).filter(i=>i.rating||i.comment||i.remark);
    return{id:s.id,date:s.date,time:s.time||"",duration:s.duration||0,location:placeOf(s),status:(s.excused||[]).includes(tid)?"cancelled":(s.status||"planned"),focus:s.focus||"",size:activeIds(s).length||1,
      activities:(s.activities||[]).map(a=>{const sk=S.skills[a.skillId]||{};return{title:a.title||"",minutes:a.minutes||0,skillId:a.skillId||"",name_en:sk.name_en||"",name_ar:sk.name_ar||""}}),
      items,general:fb.general||"",overall:fb.overall||0,remarks:fb.remarks||"",cancelReason:s.status==="cancelled"?(s.cancelReason||""):""}});
}
// What the player is allowed to see. Detailed feedback (comments, overall rating, overall feedback) only when the coach enabled it.
function buildProgress(tr){const show=!!tr.showFeedback;
  const history=historyFor(tr.id).map(h0=>{const h={...h0,remarks:"",items:h0.items.map(i=>({...i,remark:""})).filter(i=>i.rating||i.comment)};
    return show?h:{...h,items:h.items.filter(i=>i.rating).map(i=>({...i,comment:""})),general:"",overall:0}});
  return{traineeName:tr.name||"",level:tr.level??"",showFeedback:show,updatedAt:new Date().toISOString(),fixedSlots:tr.fixedSlots||[],history};}
async function syncProgress(tid){} // players now read their 360 view live from the database

// Tell each linked, still-active player that the coach cancelled a session (shows as a notice on their page).
async function notifyCoachCancel(s,reason){
  for(const tid of activeIds(s)){const tr=S.trainees[tid];if(!tr||!tr.linkedUserId)continue;const rid=s.id+":"+tr.linkedUserId;
    const item={...(R.requests[rid]||{}),id:rid,sessionId:s.id,playerUid:tr.linkedUserId,playerId:tid,coachId:s.coachId||meId,clubId:s.clubId||S.club,
      status:"coachCancelled",reason:reason||"",date:s.date,time:s.time||"",decidedAt:new Date().toISOString(),seen:false};
    await db.doc("requests/"+rid).set(item);R.requests[rid]=item}
}
async function cancelWholeSession(id,reason){
  const s=S.sessions[id];await db.doc("sessions/"+id).update({status:"cancelled",cancelReason:reason||"",updatedAt:new Date().toISOString()});
  S.sessions[id]={...s,status:"cancelled",cancelReason:reason||""};await notifyCoachCancel(S.sessions[id],reason);
  for(const tid of s.traineeIds||[])await syncProgress(tid);
}

// ---------- shared progress rendering ----------
function skillStats(history){
  const map={};
  history.slice().reverse().forEach(h=>{if(h.status==="cancelled")return;h.items.forEach(i=>{if(!i.rating)return;
    (map[i.name_en||i.skillId]=map[i.name_en||i.skillId]||{skillId:i.skillId,name_en:i.name_en,name_ar:i.name_ar,pts:[]}).pts.push({r:i.rating,d:h.date})})});
  return Object.values(map).map(m=>{const n=m.pts.length;const avg=m.pts.reduce((a,p)=>a+p.r,0)/n;const last=m.pts[n-1].r;const prev=n>1?m.pts[n-2].r:last;
    return{...m,avg,last,trend:last>prev?"up":last<prev?"down":"flat"}}).sort((a,b)=>b.pts.length-a.pts.length);
}
function spark(pts){if(pts.length<2)return`<svg class="spark" viewBox="0 0 96 28" aria-hidden="true"><line x1="0" y1="26" x2="96" y2="26" stroke="var(--line)"/><circle cx="48" cy="${26-(pts[0]?.r||0)*4.6}" r="3" fill="var(--court)"/></svg>`;
  const n=pts.length,xs=i=>4+i*(88/(n-1)),ys=r=>26-r*4.6;
  const line=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)} ${ys(p.r).toFixed(1)}`).join(" ");
  const area=line+` L${xs(n-1).toFixed(1)} 27 L${xs(0).toFixed(1)} 27 Z`;
  const flip=lang==="ar"?' style="transform:scaleX(-1)"':"";
  return`<svg class="spark" viewBox="0 0 96 28" aria-hidden="true"${flip}><line x1="0" y1="${ys(3)}" x2="96" y2="${ys(3)}" stroke="var(--line)" stroke-dasharray="2 3"/><path d="${area}" fill="var(--court-soft)"/><path d="${line}" fill="none" stroke="var(--court)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${xs(n-1)}" cy="${ys(pts[n-1].r)}" r="3" fill="var(--court)"/></svg>`}
function progressBlock(history){
  const st=skillStats(history);
  if(!st.length)return`<div class="card muted">${t("noFeedbackYet")}</div>`;
  return`<div class="card">${st.map(s=>`<div class="skillrow"><div class="n"><b>${esc(skillName(s.skillId,s))}</b><div class="trend ${s.trend}">${t(s.trend==="up"?"trendUp":s.trend==="down"?"trendDown":"trendFlat")} · ${s.pts.length} ${t("sessionsWord")}</div></div>
   <div title="${t("latest")}">${dots(s.last)}</div>${spark(s.pts)}<div class="avg muted" style="font-size:13px">${t("avgRating")}<br><b style="color:var(--ink)">${s.avg.toFixed(1)}</b></div></div>`).join("")}</div>`;
}
function historyBlock(history,linkSessions){
  const rows=history.filter(h=>h.status!=="planned"||h.items.length||h.general||h.overall||h.remarks);
  if(!rows.length)return"";
  return`<div class="hist">${rows.map(h=>{const head=`<div class="spread"><div><b>${esc(fmtShort(h.date))}</b> <span class="muted">${esc(h.time)}</span></div><div class="row">${kindPill(h.size)}${statusPill(h.status)}</div></div>
   ${h.focus?`<div>${esc(h.focus)}</div>`:""}
   ${h.coachName||h.clubName?`<div class="muted" style="font-size:13px">${esc([h.coachName&&t("coachLabel")+": "+h.coachName,h.clubName].filter(Boolean).join(" · "))}</div>`:""}
   ${h.cancelReason?`<div class="muted" style="font-size:14px">${t("reasonLabel")}: ${esc(h.cancelReason)}</div>`:""}
   ${h.items.length?`<div class="stack" style="gap:8px">${h.items.map(i=>`<div class="fbline"><span>${dots(i.rating)}</span><span><b>${esc(skillName(i.skillId,i))}</b>${i.rating?` <span class="muted">· ${t("r"+i.rating)}</span>`:""}</span>${i.comment?`<span class="c">${esc(i.comment)}</span>`:""}${linkSessions&&i.remark?`<span class="c priv"><svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>${esc(i.remark)}</span>`:""}</div>`).join("")}</div>`:""}
   ${linkSessions&&h.remarks?`<div class="priv"><svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>${esc(h.remarks)}</div>`:""}
   ${h.overall||h.general?`<div style="border-inline-start:3px solid var(--orange);padding-inline-start:10px;display:grid;gap:4px">${h.overall?`<span><b>${t("overallLabel")}</b> ${dots(h.overall)} <span class="muted">${t("r"+h.overall)}</span></span>`:""}${h.general?`<span>${esc(h.general)}</span>`:""}</div>`:""}`;
   return linkSessions?`<a class="card item" href="#session-${h.id}">${head}</a>`:`<div class="card item">${head}</div>`}).join("")}</div>`;
}

 ["wall","حائط"],["glass","زجاج"],["back","خلفي"],["side","جانبي"],["defence","دفاع"],["defense","دفاع"],["attack","هجوم"],["net","شبكة"],["drill","تمرين"],

const normEn=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const normAr=x=>String(x||"").replace(/[ً-ْـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^ء-ي0-9 ]+/g," ")
  .split(/\s+/).filter(Boolean).map(w=>w.replace(/^(وال|بال|فال|كال|لل|ال)(?=\S{2,})/,"")).join(" ").trim();
function glossary(){const seen=new Set(),out=[];
  const add=(en,ar,cat)=>{if(!en||!ar)return;const k=normEn(en)+"|"+normAr(ar);if(seen.has(k))return;seen.add(k);out.push({en,ar,cat})};
  Object.values(S.skills||{}).forEach(x=>add(x.name_en,x.name_ar,x.category));PADEL_TERMS.forEach(([en,ar,cat])=>add(en,ar,cat));return out}
// Best matches for a name typed in one language: whole terms first (exact, then starts-with / contains), then word by word.
function suggestOther(text,from){const q=from==="ar"?normAr(text):normEn(text);if(q.length<2)return[];
  const key=e=>from==="ar"?normAr(e.ar):normEn(e.en);const scored=[];
  glossary().forEach(e=>{const k=key(e);let sc=0;
    if(k===q)sc=100;else if(k.startsWith(q)||q.startsWith(k))sc=70-Math.abs(k.length-q.length)/10;else if(k.includes(q)||q.includes(k))sc=50-Math.abs(k.length-q.length)/10;
    else{const qw=q.split(" "),kw=k.split(" ");const hit=qw.filter(w=>kw.includes(w)).length;if(hit)sc=20*hit/Math.max(qw.length,kw.length)}
    if(sc>0)scored.push({...e,sc})});
  scored.sort((a,b)=>b.sc-a.sc);const out=scored.slice(0,4).map(e=>({text:from==="ar"?e.en:e.ar,cat:e.cat,exact:e.sc===100}));
  if(!out.some(o=>o.exact)){const words=q.split(" ");const tr=words.map(w=>{const hit=PADEL_WORDS.find(([en,ar])=>from==="ar"?normAr(ar)===w:normEn(en)===w);return hit?(from==="ar"?hit[0]:hit[1]):null});
    if(tr.every(Boolean)&&words.length>1){const txt=from==="ar"?tr.map(w=>w[0].toUpperCase()+w.slice(1)).join(" "):tr.join(" ");if(!out.some(o=>o.text===txt))out.push({text:txt,cat:"",exact:false})}}
  return out}

   init:f=>{const en=f.querySelector("#sk-en"),ar=f.querySelector("#sk-ar"),cat=f.querySelector("#sk-cat");
    // what the app filled in itself may be replaced while typing; anything typed by hand is kept
    const auto={en:false,ar:false};let catAuto=!id;
    const show=(from)=>{const src=from==="ar"?ar:en,dst=from==="ar"?en:ar,box=f.querySelector(from==="ar"?"#sug-en":"#sug-ar");const other=from==="ar"?"en":"ar";
      const list=src.value.trim()?suggestOther(src.value,from):[];
      if(list[0]&&list[0].exact&&(!dst.value.trim()||auto[other])){dst.value=list[0].text;auto[other]=true;if(catAuto&&list[0].cat)cat.value=list[0].cat}
      else if(!src.value.trim()&&auto[other]){dst.value="";auto[other]=false}
      const rest=list.filter(o=>o.text!==dst.value);
      box.innerHTML=rest.length?`<span class="muted">${t("suggested")}:</span> `+rest.map(o=>`<button type="button" class="chipbtn" data-sug="${esc(o.text)}" data-cat="${esc(o.cat||"")}" dir="${other==="ar"?"rtl":"ltr"}">${esc(o.text)}</button>`).join(""):"";
      box.querySelectorAll("[data-sug]").forEach(b=>b.addEventListener("click",()=>{dst.value=b.dataset.sug;auto[other]=false;if(catAuto&&b.dataset.cat)cat.value=b.dataset.cat;box.innerHTML="";dst.focus()}))};
    en.addEventListener("input",()=>{auto.en=false;show("en")});ar.addEventListener("input",()=>{auto.ar=false;show("ar")});

}

// ---------- fixed schedule ----------
function slotLabel(sl){return `${t("every")} ${dayName(sl.day)} · ${sl.time||"--:--"}${sl.duration?" · "+sl.duration+" "+t("min"):""}`}
// Book one occurrence of fixed slots for some trainees on a date: joins a planned session at the same date+time, else creates one.
async function bookOccurrence(tids,date,time,duration,location,courtId){
  const touched=new Set(tids);
  const ex=Object.values(S.sessions).find(x=>x.date===date&&(x.time||"")===(time||"")&&x.status!=="cancelled"&&(!x.coachId||x.coachId===meId)&&(x.courtId||"")===(courtId||""));
  if(ex){const add=tids.filter(id=>!(ex.traineeIds||[]).includes(id));if(!add.length)return{n:0,touched:[]};
    const ids=[...(ex.traineeIds||[]),...add];await db.doc("sessions/"+ex.id).update({traineeIds:ids,updatedAt:new Date().toISOString()});
    S.sessions[ex.id]={...ex,traineeIds:ids};ids.forEach(i=>touched.add(i));return{n:1,touched:[...touched]}}
  const nid=uid();const doc={id:nid,date,time:time||"",duration:duration===""||duration==null?"":Number(duration),status:"planned",location:location||"",courtId:courtId||"",courtName:((courtsAt(location).find(c=>c.id===courtId)||{}).name||""),focus:"",traineeIds:[...tids],activities:[],feedback:{},fromSlot:true,updatedAt:new Date().toISOString()};
  await db.doc("sessions/"+nid).set(doc);S.sessions[nid]=doc;return{n:1,touched:[...touched]};
}
// occurrences of every trainee's fixed slots in [from, to] that are not yet booked, merged by date+time
// ---------- blocked time ----------
function blocksOn(d){return Object.values(S.blocks).filter(b=>b.from&&d>=b.from&&d<=(b.to||b.from)).sort((a,b)=>(a.allDay?0:1)-(b.allDay?0:1)||String(a.start).localeCompare(String(b.start)))}
function blockConflict(d,st,en,who){return blocksOn(d).filter(b=>!who||!b.coachId||b.coachId===who).find(b=>b.allDay||((toMin(b.start)??0)<en&&(toMin(b.end)??24*60)>st))}
function blockRange(b){const multi=b.to&&b.to!==b.from;const dates=multi?`${fmtShort(b.from)} – ${fmtShort(b.to)}`:fmtShort(b.from);return `${dates} · ${b.allDay?t("allDay"):`${b.start}–${b.end}`}`}
function blockCard(b){return`<div class="card spread blockcard"><div style="min-width:0"><b>⛔ ${t("blocked")}</b> · <span>${esc(blockRange(b))}</span>${b.reason?`<div class="muted" style="font-size:13px">${esc(b.reason)}</div>`:""}</div><button class="btn sm" data-act="editBlock" data-id="${esc(b.id)}">${t("edit")}</button></div>`}
function blockSheet(id,preDate){
  const b=id?S.blocks[id]:{from:preDate||todayISO(),to:"",allDay:false,start:"13:00",end:"15:00",reason:""};
  const body=`<p class="muted" style="margin:0;font-size:14px">${t("blockHint")}</p>
  <div class="fgrid"><label class="f">${t("fromDate")}<input type="date" id="bl-from" name="from" value="${esc(b.from)}"></label>
  <label class="f">${t("toDate")}<input type="date" id="bl-to" name="to" value="${esc(b.to&&b.to!==b.from?b.to:"")}"></label></div>
  <label class="toggle"><input type="checkbox" id="bl-all" name="allDay" ${b.allDay?"checked":""}><span><b>${t("allDay")}</b></span></label>
  <div class="fgrid" id="bl-times" ${b.allDay?"hidden":""}><label class="f">${t("startT")}<input type="time" id="bl-start" name="start" value="${esc(b.start||"")}"></label><label class="f">${t("endT")}<input type="time" id="bl-end" name="end" value="${esc(b.end||"")}"></label></div>

  openSheet(id?t("editBlock"):t("blockTime"),body,async f=>{
    const from=val(f,"from"),to=val(f,"to")||from,all=f.elements.allDay.checked,st=val(f,"start"),en=val(f,"end");
    if(!from)return t("needDate");if(to<from)return t("toBeforeFrom");if(!all&&(!st||!en||toMin(en)<=toMin(st)))return t("endBeforeStart");
    const nid=id||uid();const doc={id:nid,from,to,allDay:all,start:all?"":st,end:all?"":en,reason:val(f,"reason"),updatedAt:new Date().toISOString()};
    if(!await guard(()=>db.doc("blocks/"+nid).set(doc)))return false;S.blocks[nid]=doc;toast(t("saved"));render();

   submitClass:"danger armed",submitLabel:id?t("save"):t("blockTime"),
   init:f=>{f.elements.allDay.addEventListener("change",()=>{f.querySelector("#bl-times").hidden=f.elements.allDay.checked})}});
}
function blockBands(d,lo,hi,px){return blocksOn(d).map(b=>{const s0=b.allDay?lo:Math.max(lo,toMin(b.start)??lo),e0=b.allDay?hi:Math.min(hi,toMin(b.end)??hi);if(e0<=s0)return"";
  return`<button type="button" class="bband" data-act="editBlock" data-id="${esc(b.id)}" style="top:${px(s0)}px;height:${px(e0)-px(s0)}px" title="${esc(t("blocked")+(b.reason?" · "+b.reason:""))}"><span>⛔ ${b.allDay?t("allDay"):esc(b.start+"–"+b.end)}${b.reason?" · "+esc(b.reason):""}</span></button>`}).join("")}

function pendingOccurrences(from,to,onlyTid){
  const td=todayISO(),map={};
  Object.values(S.trainees).forEach(tr=>{if(onlyTid&&tr.id!==onlyTid)return;(tr.fixedSlots||[]).forEach(sl=>{
    for(let d=addDays(from,(sl.day-weekdayOf(from)+7)%7);d<=to;d=addDays(d,7)){if(d<td)continue;
      const booked=Object.values(S.sessions).some(x=>x.date===d&&(x.time||"")===(sl.time||"")&&x.status!=="cancelled"&&(x.traineeIds||[]).includes(tr.id));
      if(booked)continue;{const st=toMin(sl.time);if(blockConflict(d,st==null?0:st,st==null?24*60:st+(+sl.duration||60)))continue}const k=d+"|"+(sl.time||"")+"|"+(sl.courtId||"");(map[k]=map[k]||{date:d,time:sl.time||"",duration:sl.duration,location:sl.location||"",courtId:sl.courtId||"",tids:[]}).tids.push(tr.id)}})});
  return Object.values(map).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
async function generateFor(tid,weeks){
  const td=todayISO(),occ=pendingOccurrences(td,addDays(td,weeks*7-1),tid);let n=0;const touched=new Set();
  let skipped=0;
  for(const o of occ){try{const res=await bookOccurrence(o.tids,o.date,o.time,o.duration,o.location,o.courtId);n+=res.n;res.touched.forEach(i=>touched.add(i))}catch(e){if(friendlyErr(e))skipped++;else throw e}}
  for(const id of touched)await syncProgress(id);S.genSkipped=skipped;return n;
}

  const courtRows=()=>courts.map((x,i)=>`<div class="row" style="gap:8px;flex-wrap:nowrap" data-ci="${i}"><input type="text" id="ct-en-${i}" data-cf="name" aria-label="${t("courtName")} (EN)" placeholder="Court ${i+1}" value="${esc(x.name||"")}"><input type="text" id="ct-ar-${i}" data-cf="name_ar" dir="rtl" aria-label="${t("courtName")} (AR)" placeholder="ملعب ${i+1}" value="${esc(x.name_ar||"")}"><button type="button" class="btn sm danger" data-crm="${i}" aria-label="${t("delete")}">✕</button></div>`).join("");
  const body=`<label class="f">${t("clubName")}<input type="text" id="cl-name" name="name" value="${esc(c.name||"")}"></label>
  <div class="stack" style="gap:8px"><span style="font-size:13px;font-weight:600;color:var(--muted)">${t("courts")}</span><span class="muted" style="font-size:13px">${t("courtsHint")}</span><div class="stack" style="gap:8px" id="courtRows">${courtRows()}</div><div><button type="button" class="btn sm" data-addcourt>+ ${t("addCourt")}</button></div></div>
  <label class="row" style="gap:8px;font-size:14px"><input type="checkbox" id="cl-def" name="isDefault" ${c.isDefault?"checked":""} style="accent-color:var(--court);width:18px;height:18px">${t("setDefault")}</label>`;
  openSheet(id?t("editClub"):t("addClub"),body,async f=>{
    const name=val(f,"name");if(!name)return t("required");const def=f.elements.isDefault.checked;const nid=id||uid();
    const cl=courts.filter(x=>(x.name||"").trim()).map(x=>({id:x.id||nid+"-"+uid().slice(0,6),name:x.name.trim(),name_ar:(x.name_ar||"").trim()}));
    if(!await guard(async()=>{await db.doc("clubs/"+nid).set({...(id?S.clubs[id]:{}),id:nid,name,isDefault:def,courts:cl});
      if(def)for(const o of Object.values(S.clubs))if(o.id!==nid&&o.isDefault)await db.doc("clubs/"+o.id).update({isDefault:false})}))return false;toast(t("saved"));
  },{onDelete:id?async()=>{const ok=await guard(()=>db.doc("clubs/"+id).delete());if(ok)toast(t("deleted"));return ok}:null,
   init:f=>{const box=f.querySelector("#courtRows");
    box.addEventListener("input",e=>{const el=e.target.closest("[data-cf]");if(!el)return;courts[+el.closest("[data-ci]").dataset.ci][el.dataset.cf]=el.value});

}

const toMin=t2=>{const m=/^(\d{1,2}):(\d{2})/.exec(t2||"");return m?(+m[1])*60+(+m[2]):null};
const fmtMin=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function weekNumber(iso){const d=new Date(iso+"T00:00:00"),j=new Date(d.getFullYear(),0,1);return Math.floor(((d-j)/864e5+j.getDay())/7)+1}
function layoutDay(items){ // greedy lanes for overlapping blocks
  items.sort((a,b)=>a.s-b.s||b.e-a.e);const lanes=[];let cluster=[],clusterEnd=-1;const out=[];
  const flush=()=>{const n=Math.max(1,...cluster.map(c=>c.lane+1));cluster.forEach(c=>c.n=n);cluster=[]};
  items.forEach(it=>{if(it.s>=clusterEnd&&cluster.length){flush();lanes.length=0}
    let li=lanes.findIndex(e=>e<=it.s);if(li<0){li=lanes.length;lanes.push(0)}lanes[li]=it.e;it.lane=li;cluster.push(it);out.push(it);clusterEnd=Math.max(clusterEnd,it.e)});
  if(cluster.length)flush();return out;
}

function vWeek(){

  const fp=S.wkPlayer&&S.trainees[S.wkPlayer]?S.wkPlayer:"",fc=S.wkClub||"";
  const sess=sortedSessions().filter(x=>x.date>=ws&&x.date<=we&&(!fp||(x.traineeIds||[]).includes(fp))&&(!fc||(x.location||"")===fc));
  const ghosts=pendingOccurrences(ws,we,fp||undefined).filter(g=>!fc||(g.location||"")===fc);

    ghosts.filter(g=>g.date===d).forEach(g=>{const st=toMin(g.time);if(st==null)return;its.push({s:st,e:st+(+g.duration||60),k:"g",g})});
    return layoutDay(its)});
  let lo=7*60,hi=23*60;per.flat().forEach(it=>{lo=Math.min(lo,Math.floor(it.s/60)*60);hi=Math.max(hi,Math.ceil(it.e/60)*60)});hi=Math.min(hi,24*60);

function blockHtml(it,px){

  const x=it.x,n=activeIds(x).length,[fd,ft]=feedbackCount(x);
  const cls=x.status==="cancelled"?"cancelled":x.status==="done"?"done":n>1?"grp":"";
  return`<div class="blk ${cls}" style="${pos}"><a href="#session-${x.id}" title="${esc(tr)} · ${esc((x.traineeIds||[]).map(trName).join(", "))}"><span class="bt">${tr}${n>1?` · ${n}`:""}</span><span class="bn">${namesHtml(x)}</span>${x.status==="done"&&ft?`<span class="bm">★ ${fd}/${ft}</span>`:x.location?`<span class="bm">${esc(x.location)}</span>`:""}</a></div>`;
}

function playerCalendar(h,reqs){

let sb=null,authUser=null;
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const splitPath=p=>{const i=p.indexOf("/");return[p.slice(0,i),p.slice(i+1)]};
const snapOf=(id,row)=>({id,exists:!!row,data:()=>row?row.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}});
const throwIf=error=>{if(error){const e=new Error(error.message||"database error");e.code=error.code;throw e}};
// Live updates: any change in a collection triggers a quiet re-read of what this view shows.
function watch(collection,refetch){let tm=null;const fire=()=>{clearTimeout(tm);tm=setTimeout(refetch,150)};
  const ch=sb.channel("docs-"+collection+"-"+Math.random().toString(36).slice(2,9)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:`collection=eq.${collection}`},fire).subscribe();
  const onVis=()=>{if(document.visibilityState==="visible")fire()};document.addEventListener("visibilitychange",onVis);
  return()=>{clearTimeout(tm);sb.removeChannel(ch);document.removeEventListener("visibilitychange",onVis)}}
async function readCollection(c){const out=[];for(let from=0;;from+=1000){const {data,error}=await sb.from("docs").select("id,data").eq("collection",c).order("id").range(from,from+999);throwIf(error);out.push(...(data||[]));if(!data||data.length<1000)break}return out}
function makeDb(){
  const doc=path=>{const [c,id]=splitPath(path);const ref={id,path,
    async get(){const {data,error}=await sb.from("docs").select("data").eq("collection",c).eq("id",id).maybeSingle();throwIf(error);return snapOf(id,data)},
    async set(v){const {error}=await sb.from("docs").upsert({collection:c,id,data:v,updated_at:new Date().toISOString()});throwIf(error)},
    async update(v){const {error}=await sb.rpc("doc_merge",{p_collection:c,p_id:id,p_patch:v});throwIf(error)},
    async delete(){const {error}=await sb.from("docs").delete().eq("collection",c).eq("id",id);throwIf(error)},
    onSnapshot(next,err){let live=true;const load=async()=>{try{const sn=await ref.get();if(live)next(sn)}catch(e){if(live&&err)err(e)}};load();const stop=watch(c,load);return()=>{live=false;stop()}}};
    return ref};
  const collection=c=>({doc:id=>doc(c+"/"+id),
    onSnapshot(next,err){let live=true;const load=async()=>{try{const rows=await readCollection(c);const docs=rows.map(r=>snapOf(r.id,r));if(live)next({docs,size:docs.length,empty:!docs.length})}catch(e){if(live&&err)err(e)}};load();const stop=watch(c,load);return()=>{live=false;stop()}}});
  return{doc,collection}}
function makeUser(){return{
  async id(){return authUser?.id||null},
  async canEdit(){const {data,error}=await sb.rpc("is_staff");return !error&&data===true},

  async profiles(ids){const out={};ids.forEach(i=>out[i]={id:i,name:""});const ok=ids.filter(i=>UUID_RE.test(i));
    if(ok.length){const {data}=await sb.from("profiles").select("id,email").in("id",ok);(data||[]).forEach(p=>{if(out[p.id])out[p.id].name=p.email||""})}return out}}}

// The screens keep reading and writing whole documents. This layer files each write where the
// new model keeps it: shared player profile vs. each coach's own fields, private remarks apart
// from the session, and every club document stamped with its club (and coach).
function wrapDb(base){
  const noop={async get(){return snapOf("",null)},async set(){},async update(){},async delete(){},onSnapshot(){return()=>{}}};
  const stamp=(c,id,v)=>{const prev=R[c]?.[id];
    if(["sessions","blocks","coachnotes"].includes(c))v={...v,clubId:v.clubId||prev?.clubId||S.club,coachId:v.coachId||prev?.coachId||meId};
    if(["skills","venues"].includes(c))v={...v,clubId:v.clubId||prev?.clubId||S.club};return v};
  const splitTr=v=>{const sh={},cp={};Object.entries(v||{}).forEach(([k,x])=>{if(COACH_F.includes(k))cp[k]=x;else if(!["inviteCode","coachIds"].includes(k))sh[k]=x});return[sh,cp]};
  async function saveCoachPart(pid,cp){if(!Object.keys(cp).length)return;const id=pid+"@"+meId;const v={...(R.coachplayer[id]||{}),...cp,id,playerId:pid,coachId:meId,clubId:R.coachplayer[id]?.clubId||S.club};
    await base.doc("coachplayer/"+id).set(v);R.coachplayer[id]=v}
  const splitRemarks=fb=>{const clean={},rem={};let any=false;Object.entries(fb||{}).forEach(([tid,f])=>{const {remarks,skills,...rest}=f||{};const o={...rest};const r={};
    if(remarks!=null){r.remarks=remarks;any=true}
    if(skills){o.skills={};Object.entries(skills).forEach(([sid,x])=>{const {remark,...r2}=x||{};o.skills[sid]=r2;if(remark!=null){(r.skills=r.skills||{})[sid]=remark;any=true}})}
    clean[tid]=o;if(Object.keys(r).length)rem[tid]=r});return[clean,any?rem:null]};
  async function saveRemarks(sid,rem,replace){const s=R.sessions[sid]||{};const coach=s.coachId||meId;if(!rem||coach!==meId)return;
    const prev=R.sessremarks[sid]?.byTrainee||{};const by=replace?{}:JSON.parse(JSON.stringify(prev));
    Object.entries(rem).forEach(([tid,r])=>{const o=by[tid]||{};if(r.remarks!=null)o.remarks=r.remarks;if(r.skills)o.skills={...(o.skills||{}),...r.skills};by[tid]=o});
    const v={id:sid,sessionId:sid,coachId:meId,clubId:s.clubId||S.club,byTrainee:by};await base.doc("sessremarks/"+sid).set(v);R.sessremarks[sid]=v}
  const doc=path=>{let [c,id]=splitPath(path);if(c==="progress"||c==="claims")return noop;if(c==="clubs")c="venues";const ref=base.doc(c+"/"+id);
    if(c==="trainees")return{...ref,
      async set(v){const [sh,cp]=splitTr(v);await ref.set({...sh,id});R.trainees[id]={...sh,id};await saveCoachPart(id,cp)},
      async update(v){const [sh,cp]=splitTr(v);if(Object.keys(sh).length){await ref.update(sh);R.trainees[id]={...(R.trainees[id]||{}),...sh}}await saveCoachPart(id,cp)},
      async delete(){const {error}=await sb.rpc("remove_player",{p_org:S.club,p_player:id});throwIf(error)}};
    if(c==="sessions")return{...ref,
      async set(v){v=stamp(c,id,v);let rem=null;if(v.feedback){const [cl,r]=splitRemarks(v.feedback);v={...v,feedback:cl};rem=r}
        await ref.set(v);R.sessions[id]=v;await saveRemarks(id,rem,false)},
      async update(v){let rem=null;if(v.feedback){const [cl,r]=splitRemarks(v.feedback);v={...v,feedback:cl};rem=r}
        await ref.update(v);R.sessions[id]={...(R.sessions[id]||{}),...v};await saveRemarks(id,rem,false)},
      async delete(){await ref.delete();delete R.sessions[id];if(R.sessremarks[id]){try{await base.doc("sessremarks/"+id).delete()}catch(e){}delete R.sessremarks[id]}}};
    return{...ref,async set(v){v=stamp(c,id,v);await ref.set(v);if(R[c])R[c][id]=v}};
  };
  return{doc,collection:c=>({doc:id=>doc(c+"/"+id)})};
}

// Shrink a picture to at most 512 px and save it as JPEG, so uploads stay small.
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,512/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.86)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url})}

// ---------- boot ----------
async function boot(){
  render();
  const cfg=window.PADEL_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){role="nodb";render();return}
  // A password-reset link arrives with "type=recovery" in the address; note it before Supabase clears it.
  const fromRecovery=/type=recovery/.test(location.hash);
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{flowType:"implicit",persistSession:true,detectSessionInUrl:true}});
  // Read the session first, then listen. Only a real sign-in or sign-out (a different account) reloads the page;
  // the session report Supabase sends right after subscribing, and token refreshes, are ignored.
  loadBrand();
  {const {data}=await sb.auth.getSession();authUser=data?.session?.user||null}
  sb.auth.onAuthStateChange((ev,ses)=>{
    if(ev==="PASSWORD_RECOVERY"){authUser=ses?.user||authUser;role="reset";render();return}
    if(ev!=="SIGNED_IN"&&ev!=="SIGNED_OUT")return;
    const nu=ses?.user||null;if(role==="reset"||(nu?.id||null)===(authUser?.id||null))return;
    authUser=nu;location.replace(location.origin+location.pathname)});
  if(fromRecovery&&authUser){role="reset";render();return}
  if(role==="reset")return;
  if(!authUser){role="auth";render();loadProviders(cfg);return}
  $("#signOutBtn").hidden=false;$("#signOutBtn").textContent=t("signOut");
  user=makeUser();raw=makeDb();db=wrapDb(raw);
  if(!db){role="nodb";render();return}
  meId=user?await user.id():null;
  if(!meId){role="signedout";render();return}
  sb.from("profiles").select("full_name,display_name,phone,avatar_path,email").eq("id",meId).maybeSingle().then(({data})=>{if(data){S.me=data;render()}},()=>{});
  try{const {data,error}=await sb.rpc("my_context");throwIf(error);CTX={sysadmin:!!data?.sysadmin,memberships:data?.memberships||[],orgs:data?.orgs||[]}}catch(e){console.error(e)}
  S.myRole=CTX.sysadmin?"sysadmin":CTX.memberships.length?"coach":"player";
  const reqSub=()=>rsub("requests");
  loadMy360();setInterval(loadMy360,60000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadMy360()});
  if(S.myRole!=="player"){
    role="coach";
    const orgs=orgList();let saved="";try{saved=localStorage.getItem("padelcoach.club")||""}catch(e){}
    S.club=(orgs.find(o=>o.id===saved)||orgs[0]||{}).id||"";
    try{S.coachFilter=localStorage.getItem("padelcoach.coachf."+S.club)||""}catch(e){}
    loadPeople();await loadLinks();watchLinks();
    ["trainees","skills","sessions","venues","coachnotes","blocks","coachplayer","sessremarks"].forEach(rsub);reqSub();
  }else{
    role="trainee";reqSub();
  }
  render();
}
boot();
})();
</script>
